<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="SPujol98 — AI Engineer">
<defs>
  <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#10b981"><animate attributeName="stop-color" values="#10b981;#0ea5e9;#8b5cf6;#e11d74;#f59e0b;#10b981" dur="12s" repeatCount="indefinite"/></stop>
    <stop offset="100%" stop-color="#8b5cf6"><animate attributeName="stop-color" values="#8b5cf6;#e11d74;#f59e0b;#10b981;#0ea5e9;#8b5cf6" dur="12s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <linearGradient id="neonU" gradientUnits="userSpaceOnUse" x1="230" y1="0" x2="770" y2="0">
    <stop offset="0%" stop-color="#10b981"><animate attributeName="stop-color" values="#10b981;#0ea5e9;#8b5cf6;#e11d74;#f59e0b;#10b981" dur="12s" repeatCount="indefinite"/></stop>
    <stop offset="100%" stop-color="#8b5cf6"><animate attributeName="stop-color" values="#8b5cf6;#e11d74;#f59e0b;#10b981;#0ea5e9;#8b5cf6" dur="12s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <radialGradient id="halo" cx="50%" cy="45%" r="50%">
    <stop offset="0%" stop-color="#8b5cf6" stop-opacity=".22"><animate attributeName="stop-color" values="#8b5cf6;#0ea5e9;#e11d74;#8b5cf6" dur="12s" repeatCount="indefinite"/></stop>
    <stop offset="100%" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1a1f35" stroke-width="1"/></pattern>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <mask id="gm"><rect width="1000" height="280" fill="url(#fade)"/></mask>
  <clipPath id="frame"><rect width="1000" height="280" rx="18"/></clipPath>
  <style>
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes flow{to{stroke-dashoffset:-300}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes spinr{to{transform:rotate(-360deg)}}
    @keyframes blink{50%{opacity:0}}
    @keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(320px)}}
    .f{animation:float 5s ease-in-out infinite}
    .flow{stroke-dasharray:6 10;animation:flow 6s linear infinite}
    .orbx{transform-origin:500px 112px;animation:spin 26s linear infinite}
    .orbx2{transform-origin:500px 112px;animation:spinr 40s linear infinite}
    .cur{animation:blink 1s steps(1) infinite}
    .scan{animation:scan 7s linear infinite}
    .code{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;font-size:13px}
  </style>
</defs>
